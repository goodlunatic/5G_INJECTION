# =====================================================================
# srsRAN Project gNB 配置文件（中文注释版）
#
# 功能：
# - NR FDD 小区（Band 3）
# - 20 MHz 带宽
# - 15 kHz 子载波间隔（μ=0）
# - USRP B210 + 外部 GPSDO 时钟
# - 对接 5GC（AMF: 10.53.1.2）
#
# 适用场景：
# - 实验室 5G SA 网络
# - srsRAN gNB + 商用 UE / srsUE
#
# =====================================================================

cu_cp:
  amf:
    addr: 10.53.1.2                  # AMF（NGAP服务器）IP地址
    port: 38412                     # NGAP SCTP端口（5GC标准默认）
    bind_addr: 10.53.1.1            # gNB本机绑定IP（NG接口出口）

    supported_tracking_areas:
      - tac: 7                      # Tracking Area Code（跟踪区）

        plmn_list:
          - plmn: "00101"           # PLMN（MCC=001, MNC=01 测试网络）

            tai_slice_support_list:
              - sst: 1              # 网络切片类型（1=eMBB）

  inactivity_timer: 7200            # UE非活动定时器（秒，2小时释放连接）


ru_sdr:
  device_driver: uhd                # UHD驱动（USRP）
  device_args: type=b200            # B200/B210硬件型号

  clock: external                   # 外部10MHz时钟（GPSDO）
  srate: 23.04                      # 采样率（Msps，20MHz NR标准）

  otw_format: sc12                  # over-the-wire格式（降低USB带宽）
  tx_gain: 75                       # 发射增益（dB）
  rx_gain: 75                       # 接收增益（dB，避免ADC饱和）


cell_cfg:
  dl_arfcn: 368500                  # 下行ARFCN（Band3频点，约1842.5MHz）
  band: 3                           # NR频段3

  channel_bandwidth_MHz: 20         # 信道带宽（20MHz → 106 PRB）
  common_scs: 15                    # 子载波间隔15kHz（μ=0）

  plmn: "00101"                    # 小区PLMN（UE需匹配）
  tac: 7                           # Tracking Area Code（需与AMF一致）

  # pdcch:
  #   common:
  #     ss0_index: 0                 # SearchSpace0（SIB1/PDCCH监控位置）
  #     coreset0_index: 12           # CORESET0（控制信道资源配置）

  pdcch:
    dedicated:
      ss2_type: common               # SearchSpace2 使用 common 类型
      dci_format_0_1_and_1_1: false  # 使用 DCI 0_0/1_0，兼容 srsUE

    common:
      ss0_index: 0                   # SearchSpace0 配置
      coreset0_index: 12             # CORESET0 配置（srsUE 常用兼容值）

  prach:
    prach_config_index: 1            # PRACH 配置索引

  pdsch:
    mcs_table: qam64                 # 下行最高支持 64QAM

  pusch:
    mcs_table: qam64                 # 上行最高支持 64QAM


log:
  filename: ../logs/gnb.log        # gNB日志文件路径
  all_level: info                  # 日志级别（debug/info/warn/error）


pcap:
  mac_enable: true                 # MAC层抓包开关（Wireshark分析）
  mac_filename: ../logs/gnb_mac.pcap  # MAC PCAP输出路径

  ngap_enable: true                # NGAP抓包开关（核心网信令）
  ngap_filename: ../logs/gnb_ngap.pcap # NGAP PCAP输出路径